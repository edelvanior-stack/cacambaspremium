    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'granted',
        'ad_user_data': 'granted',
        'ad_personalization': 'granted',
        'analytics_storage': 'granted'
      });
      gtag('js', new Date());

      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var keys = ['gclid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
          var stored = {};
          try {
            stored = JSON.parse(sessionStorage.getItem('cp_sc_attribution') || '{}');
          } catch (e) {}
          var hasNew = false;
          keys.forEach(function(k) {
            var v = params.get(k);
            if (v) {
              stored[k] = v;
              hasNew = true;
            }
          });
          if (hasNew) {
            sessionStorage.setItem('cp_sc_attribution', JSON.stringify(stored));
          }
          window.dataLayer.push(Object.assign({ event: 'sc_page_view', page_path: '/sc', region: 'SC' }, stored));
        } catch (e) {}

        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          ['pointerdown', 'touchstart', 'scroll', 'keydown', 'click'].forEach(function(e) {
            window.removeEventListener(e, loadGtag, { passive: true });
          });
        }
        window.__loadGtagNow = loadGtag;
        ['pointerdown', 'touchstart', 'scroll', 'keydown', 'click'].forEach(function(e) {
          window.addEventListener(e, loadGtag, { once: true, passive: true });
        });
      })();
    </script>
